<?xml version="1.0" encoding="UTF-8"?>
<!--
  Иконка UTranslate. Капсула-пилюля из направления «Капсула»: лавандовый градиент
  (#b9a7ff, переменная accent в index.css) и белая стрелка перевода. База светлая, а не тёмная #0e1016,
  чтобы иконка не пропадала на тёмной панели задач Windows 11.

  Пересборка PNG (resvg ставится во временную папку, в репозиторий не тащим):
    npm i @resvg/resvg-js
    node -e "const{Resvg}=require('@resvg/resvg-js'),fs=require('fs');fs.writeFileSync('icon-1024.png',new Resvg(fs.readFileSync('icon.svg'),{fitTo:{mode:'width',value:1024}}).render().asPng())"
  Затем из app/: pnpm tauri icon ../design/icon-1024.png
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6c8ff"/>
      <stop offset="0.45" stop-color="#a78bff"/>
      <stop offset="1" stop-color="#6d4dff"/>
    </linearGradient>
    <clipPath id="c"><rect x="40" y="180" width="944" height="664" rx="332"/></clipPath>
    <radialGradient id="hl" cx="0.28" cy="0" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="40" y="180" width="944" height="664" rx="332" fill="url(#g)"/>
  <rect x="40" y="180" width="944" height="664" rx="332" fill="url(#hl)" clip-path="url(#c)"/>
  <g fill="none" stroke="#ffffff" stroke-width="118" stroke-linecap="round" stroke-linejoin="round">
    <path d="M272 512 H660"/>
    <path d="M596 352 L748 512 L596 672"/>
  </g>
</svg>
